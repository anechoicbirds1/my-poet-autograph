<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artist Management | Anechoic Birds</title><style>body{font-family:system-ui;background:#14121d;color:#faf7ff;margin:0}main{max-width:780px;margin:auto;padding:24px 16px}h1{color:#f5ae35}section{background:#211d2c;padding:18px;border-radius:14px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #655d72}input{background:#171420;color:white;max-width:100%;box-sizing:border-box}button{background:#f5ae35;color:#211421;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.item{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid #504759;padding:12px 0}.item input{flex:1;min-width:180px}a{color:#ffca78}#msg{color:#ffcb78}</style></head><body><main><p>ANECHOIC BIRDS · ADMIN</p><h1>Manage Artists</h1><p>Add performers, correct names, or hide them from the fan list. Existing autograph history is preserved.</p><p><a href="fan-account.html">Fan account</a> · <a href="index.html">Photo editor</a></p><p id="msg">Checking administrator access…</p><section id="manager" hidden><h2>Add an artist</h2><form id="add"><input id="newName" maxlength="120" placeholder="Artist or band name" required><button>Add Artist</button></form><h2>Artist roster</h2><div id="list"></div></section></main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';
const sb=createClient('https://ncakmtncvsribnkslsok.supabase.co','sb_publishable_mvOTUOQDUfWamS2CON_Hww_vWFTe2in');
const msg=document.getElementById('msg'),manager=document.getElementById('manager'),list=document.getElementById('list');const say=s=>msg.textContent=s;
const {data:{user}}=await sb.auth.getUser();
if(!user){say('Please sign in with your administrator account on the Fan Account page first.');}
else{const {data:admin,error}=await sb.from('admin_accounts').select('auth_user_id').eq('auth_user_id',user.id).maybeSingle();if(error||!admin){say('This page is available to Anechoic Birds administrators only.');}else{manager.hidden=false;await load();}}
async function load(){const {data,error}=await sb.from('artists').select('id,display_name,is_visible').order('display_name');if(error){say(error.message);return;}list.replaceChildren();for(const a of data){const row=document.createElement('div');row.className='item';const name=document.createElement('input');name.value=a.display_name;name.maxLength=120;name.setAttribute('aria-label','Artist name');const toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=a.is_visible;const label=document.createElement('label');label.append(toggle,document.createTextNode(' Visible'));const save=document.createElement('button');save.textContent='Save';save.onclick=async()=>{const updated=name.value.trim();if(!updated){say('Artist name cannot be empty.');return;}save.disabled=true;const {error}=await sb.from('artists').update({display_name:updated,is_visible:toggle.checked}).eq('id',a.id);say(error?'Could not save: '+error.message:'Saved '+updated);save.disabled=false;if(!error)await load();};row.append(name,label,save);list.append(row);}say(data.length+' artists loaded.');}
document.getElementById('add').addEventListener('submit',async e=>{e.preventDefault();const input=document.getElementById('newName'),name=input.value.trim();if(!name)return;const slug=name.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const {error}=await sb.from('artists').insert({display_name:name,slug,is_visible:true,is_official:true});if(error){say('Could not add artist: '+error.message);return;}input.value='';await load();});
</script></body></html>
