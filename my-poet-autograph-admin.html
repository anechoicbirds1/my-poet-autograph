<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Poet Autograph — Admin</title><style>body{font-family:system-ui,Arial;background:#111827;color:#fff;margin:0;padding:25px}main{max-width:900px;margin:auto}section{background:#1f2937;border-radius:14px;padding:22px;margin:18px 0}input,button{padding:12px;border-radius:8px;border:1px solid #6b7280;font:inherit}input{display:block;margin:10px 0;width:min(90%,350px)}button{background:#f1c66b;color:#111827;cursor:pointer;font-weight:700}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats div{background:#374151;padding:15px;border-radius:10px}.stats strong{display:block;font-size:26px}article{border-top:1px solid #6b7280;padding:15px 0}.muted{color:#d1d5db}</style></head><body><main><h1>My Poet Autograph</h1><p class="muted">Anechoic Birds · Private administrator dashboard</p><section id="login"><h2>Administrator sign in</h2><form id="form"><label>Email<input id="email" type="email" autocomplete="username" value="anechoicbirds.website@gmail.com" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><p id="loginMsg" role="status"></p></section><div id="dashboard" class="hidden"><section><button id="logout">Sign out</button><p id="who"></p><div class="stats"><div><strong id="pending">—</strong>Pending</div><div><strong id="approved">—</strong>Approved</div><div><strong id="rewards">—</strong>Shirt credits</div></div></section><section><h2>Pending photo submissions</h2><p class="muted">Review buttons will be enabled after the secure approval workflow is connected.</p><div id="items">Loading…</div></section></div><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const sb=createClient('https://ncakmtncvsribnkslsok.supabase.co','sb_publishable_mvOTUOQDUfWamS2CON_Hww_vWFTe2in');
const el=id=>document.getElementById(id);
async function render(){const {data:{user}}=await sb.auth.getUser();if(!user){el('login').classList.remove('hidden');el('dashboard').classList.add('hidden');return}
const {data:admin,error:adminError}=await sb.from('admin_accounts').select('id').eq('auth_user_id',user.id).maybeSingle();if(adminError||!admin){await sb.auth.signOut();el('loginMsg').textContent='This account is not authorized as an administrator.';return}
el('login').classList.add('hidden');el('dashboard').classList.remove('hidden');el('who').textContent='Signed in as '+user.email;
const [sub,credit]=await Promise.all([sb.from('photo_submissions').select('id,status,submitted_at,artist_id,fan_id').order('submitted_at',{ascending:false}).limit(100),sb.from('reward_credits').select('id',{count:'exact',head:true})]);if(sub.error){el('status').textContent=sub.error.message;return}
const rows=sub.data||[];el('pending').textContent=rows.filter(x=>x.status==='pending').length;el('approved').textContent=rows.filter(x=>['approved','approved_with_shirt'].includes(x.status)).length;el('rewards').textContent=credit.count??'—';
const [artists,fans]=await Promise.all([sb.from('artists').select('id,display_name'),sb.from('fans').select('id,full_name,email')]);const names=new Map((artists.data||[]).map(x=>[x.id,x.display_name]));const people=new Map((fans.data||[]).map(x=>[x.id,x]));const pending=rows.filter(x=>x.status==='pending');el('items').replaceChildren();if(!pending.length){el('items').textContent='No pending submissions yet.';return}for(const s of pending){const person=people.get(s.fan_id);const art=document.createElement('article');const title=document.createElement('h3');title.textContent=names.get(s.artist_id)||'Unknown artist';const details=document.createElement('p');details.textContent=(person?person.full_name+' · '+person.email:'Fan unavailable')+' · '+new Date(s.submitted_at).toLocaleString();const note=document.createElement('p');note.className='muted';note.textContent='Awaiting secure review controls';art.append(title,details,note);el('items').append(art)}}
el('form').addEventListener('submit',async e=>{e.preventDefault();el('loginMsg').textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});el('password').value='';if(error){el('loginMsg').textContent=error.message;return}el('loginMsg').textContent='';await render()});el('logout').addEventListener('click',async()=>{await sb.auth.signOut();await render()});render().catch(e=>el('status').textContent=e.message);
</script></body></html>
