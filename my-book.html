<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Autograph Book | Anechoic Birds</title><style>body{margin:0;background:#13101c;color:#fff;font-family:Arial,sans-serif}main{max-width:980px;margin:auto;padding:24px}a{color:#ffbf58}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:2.2rem}p{color:#d3cbdc}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.item{background:#211b2e;border:1px solid #534464;border-radius:14px;overflow:hidden}.item img{width:100%;height:240px;object-fit:contain;background:#0d0b13}.details{padding:15px}.status{font-size:.85rem;color:#ffbf58}button{background:#ffbf58;border:0;border-radius:8px;padding:10px;cursor:pointer}#message{padding:15px;background:#211b2e;border-radius:12px}</style></head><body><main><header><div><div>ANECHOIC BIRDS · YOUR VOICE MATTERS</div><h1>My Autograph Book</h1></div><nav><a href="index.html">← Take or Sign a Photo</a></nav></header><p>Your personal collection of submitted and approved autographs. Photos awaiting review are visible only to you and administrators.</p><div id="message" role="status">Checking your account…</div><div class="grid" id="photos"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient('https://ncakmtncvsribnkslsok.supabase.co','sb_publishable_mvOTUOQDUfWamS2CON_Hww_vWFTe2in');const msg=document.getElementById('message'),grid=document.getElementById('photos');function node(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}async function manage(id,action,extra={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sign in again.');const r=await fetch('https://ncakmtncvsribnkslsok.supabase.co/functions/v1/manage-autograph',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_mvOTUOQDUfWamS2CON_Hww_vWFTe2in','Authorization':'Bearer '+session.access_token},body:JSON.stringify({submission_id:id,action,...extra})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{const {data:{user},error:authError}=await sb.auth.getUser();if(authError)throw authError;if(!user){msg.replaceChildren(node('span','Please sign in to view your book. '));const a=node('a','Sign in or create account');a.href='fan-account.html';msg.append(a);return}const {data:fan,error:fanError}=await sb.from('fans').select('id').eq('auth_user_id',user.id).maybeSingle();if(fanError)throw fanError;if(!fan){msg.textContent='Your fan profile is not ready yet. Please return to your account page.';return}const {data:photos,error}=await sb.from('photo_submissions').select('id,status,submitted_at,original_storage_path,approved_storage_path,is_public,artists(display_name)').eq('fan_id',fan.id).order('submitted_at',{ascending:false});if(error)throw error;if(!photos?.length){msg.textContent='Your book is ready! Submit your first signed photo to begin your collection.';return}msg.textContent=photos.length+' photo'+(photos.length===1?'':'s')+' in your collection';for(const p of photos){const card=node('article',null,'item'),img=node('img'),d=node('div',null,'details');img.alt='Signed photo with '+(p.artists?.display_name||'performer');const approved=['approved','approved_with_shirt'].includes(p.status)&&p.approved_storage_path;const bucket=approved?'autograph-approved':'autograph-pending';const path=approved?p.approved_storage_path:p.original_storage_path;{const {data:signed,error:signError}=await sb.storage.from(bucket).createSignedUrl(path,1800);if(!signError&&signed)img.src=signed.signedUrl}d.append(node('h3',p.artists?.display_name||'Performer'),node('div',['approved','approved_with_shirt'].includes(p.status)?'Approved':p.status==='pending'?'Awaiting approval':p.status,'status'),node('p',new Date(p.submitted_at).toLocaleDateString()));if(p.status==='approved'||p.status==='approved_with_shirt'){const privacy=node('button',p.is_public?'Make Private':'Share with Community');privacy.type='button';privacy.style.marginRight='8px';privacy.onclick=async()=>{privacy.disabled=true;try{await manage(p.id,'visibility',{is_public:!p.is_public});p.is_public=!p.is_public;privacy.textContent=p.is_public?'Make Private':'Share with Community';msg.textContent=p.is_public?'Photo marked for community sharing.':'Photo is now private in your book.'}catch(e){alert(e.message)}finally{privacy.disabled=false}};d.append(privacy)}const del=node('button','Delete Photo');del.type='button';del.style.background='#f8a6aa';del.onclick=async()=>{if(!confirm('Permanently delete this photo from your autograph book and website storage? This cannot be undone.'))return;del.disabled=true;try{await manage(p.id,'delete');card.remove();msg.textContent='Photo deleted.'}catch(e){alert(e.message);del.disabled=false}};d.append(del);card.append(img,d);grid.append(card)}}catch(e){msg.textContent='Could not load your autograph book: '+e.message}}load();</script></body></html>
