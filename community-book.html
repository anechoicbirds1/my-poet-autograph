<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Autograph Book | Anechoic Birds</title><style>*,*:before,*:after{box-sizing:border-box}body{margin:0;background:#15111d;color:#fff;font-family:system-ui,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:25px 15px 45px}h1{font-size:clamp(25px,4vw,39px);margin:8px 0}p{color:#d8cfe2;line-height:1.5}.eyebrow{color:#f6bb69;letter-spacing:.16em;font-size:12px;font-weight:700}select{padding:12px;border-radius:9px;background:#292034;color:white;border:1px solid #665574;width:100%;max-width:330px;margin:15px 0 22px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:18px}.card{background:#251c30;border:1px solid #493956;border-radius:14px;overflow:hidden}.card img{display:block;width:100%;height:260px;object-fit:contain;background:#0e0b13}.meta{padding:13px 15px}.meta strong{display:block}.meta span{display:block;color:#cbbfd5;font-size:13px;margin-top:6px}.empty{padding:28px;border:1px dashed #695775;border-radius:12px;color:#e3d9e9}button{background:#f6bb69;color:#1a1021;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #f6bb69}</style></head><body><main><div class="eyebrow">ANECHOIC BIRDS · YOUR VOICE MATTERS</div><h1>Community Autograph Book</h1><p>Explore approved memories shared by the poetry community. Each autograph is part of our story.</p><label for="artist">Browse by poet</label><div><select id="artist"><option value="">All poets</option></select></div><div id="status" role="status" aria-live="polite">Loading community photos…</div><div id="grid" class="grid"></div></main><script>const endpoint='https://ncakmtncvsribnkslsok.supabase.co/functions/v1/community-autographs';const grid=document.getElementById('grid'),status=document.getElementById('status'),filter=document.getElementById('artist');let all=[];function draw(){grid.replaceChildren();const rows=all.filter(p=>!filter.value||p.artist===filter.value);status.textContent=rows.length?rows.length+' shared autograph'+(rows.length===1?'':'s'):'No shared autographs for this selection yet.';for(const p of rows){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.loading='lazy';img.alt='Signed autograph photo with '+p.artist;img.src=p.photo_url;const meta=document.createElement('div');meta.className='meta';const name=document.createElement('strong');name.textContent=p.artist;const date=document.createElement('span');date.textContent=new Date(p.submitted_at).toLocaleDateString();meta.append(name,date);card.append(img,meta);grid.append(card)}}async function load(){try{const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)throw Error('Gallery temporarily unavailable');const data=await r.json();all=Array.isArray(data.photos)?data.photos:[];const artists=[...new Set(Array.isArray(data.artists)?data.artists:[])].sort((a,b)=>a.localeCompare(b));for(const artist of artists){const opt=document.createElement('option');opt.value=artist;opt.textContent=artist;filter.append(opt)}draw()}catch(e){status.textContent='Could not load the gallery right now. Please refresh the page.'}}filter.addEventListener('change',draw);load();</script></body></html>
