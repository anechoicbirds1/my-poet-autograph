<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Autograph Book | Anechoic Birds</title><style>*,*:before,*:after{box-sizing:border-box}body{margin:0;background:#15111d;color:#fff;font-family:system-ui,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:25px 15px 45px}h1{font-size:clamp(25px,4vw,39px);margin:8px 0}p{color:#d8cfe2;line-height:1.5}.eyebrow{color:#f6bb69;letter-spacing:.16em;font-size:12px;font-weight:700}select{padding:12px;border-radius:9px;background:#292034;color:white;border:1px solid #665574;width:100%;max-width:330px;margin:15px 0 22px;font-size:16px}.book{perspective:1300px;overflow:hidden;padding:8px 3px 14px}.sheet{transform-origin:left center;backface-visibility:hidden}.sheet.turn-next{animation:turnNext .55s ease-in-out}.sheet.turn-prev{animation:turnPrev .55s ease-in-out}@keyframes turnNext{0%{transform:rotateY(0);opacity:1}48%{transform:rotateY(-72deg);opacity:.35}49%{transform:rotateY(72deg);opacity:.35}100%{transform:rotateY(0);opacity:1}}@keyframes turnPrev{0%{transform:rotateY(0);opacity:1}48%{transform:rotateY(72deg);opacity:.35}49%{transform:rotateY(-72deg);opacity:.35}100%{transform:rotateY(0);opacity:1}}.page-controls{display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;margin:20px 0}.page-controls[hidden]{display:none}.page-controls button:disabled{opacity:.4;cursor:not-allowed}@media(prefers-reduced-motion:reduce){.sheet.turn-next,.sheet.turn-prev{animation:none}}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:18px}.card{background:#251c30;border:1px solid #493956;border-radius:14px;overflow:hidden}.card img{display:block;width:100%;height:260px;object-fit:contain;background:#0e0b13}.meta{padding:13px 15px}.meta strong{display:block}.meta span{display:block;color:#cbbfd5;font-size:13px;margin-top:6px}.empty{padding:28px;border:1px dashed #695775;border-radius:12px;color:#e3d9e9}button{background:#f6bb69;color:#1a1021;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #f6bb69}</style></head><body><main><div class="eyebrow">ANECHOIC BIRDS · YOUR VOICE MATTERS</div><h1>Community Autograph Book</h1><p>Explore approved memories shared by the poetry community. Each autograph is part of our story.</p><label for="artist">Browse by poet</label><div><select id="artist"><option value="">All poets</option></select></div><div id="status" role="status" aria-live="polite">Loading community photos…</div><div class="book"><div id="sheet" class="sheet"><div id="grid" class="grid"></div></div></div><nav id="pages" class="page-controls" aria-label="Autograph book pages" hidden><button id="previous" type="button">← Previous Page</button><span id="pageNumber" aria-live="polite"></span><button id="next" type="button">Next Page →</button></nav></main><script>const endpoint='https://ncakmtncvsribnkslsok.supabase.co/functions/v1/community-autographs';
const grid=document.getElementById('grid'),sheet=document.getElementById('sheet'),status=document.getElementById('status'),filter=document.getElementById('artist'),pages=document.getElementById('pages'),previous=document.getElementById('previous'),next=document.getElementById('next'),pageNumber=document.getElementById('pageNumber');
const perPage=4;let all=[],page=0,busy=false;
function matching(){return all.filter(p=>!filter.value||p.artist===filter.value)}
function draw(){const rows=matching(),count=Math.ceil(rows.length/perPage);page=Math.max(0,Math.min(page,Math.max(0,count-1)));grid.replaceChildren();status.textContent=rows.length?rows.length+' shared autograph'+(rows.length===1?'':'s'):'No shared autographs for this selection yet.';for(const p of rows.slice(page*perPage,(page+1)*perPage)){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.loading='lazy';img.alt='Signed autograph photo with '+p.artist;img.src=p.photo_url;const meta=document.createElement('div');meta.className='meta';const name=document.createElement('strong');name.textContent=p.artist;const date=document.createElement('span');date.textContent=new Date(p.submitted_at).toLocaleDateString();meta.append(name,date);card.append(img,meta);grid.append(card)}pages.hidden=count<=1;previous.disabled=page===0;next.disabled=page>=count-1;pageNumber.textContent='Page '+(page+1)+' of '+Math.max(count,1)}
function turn(direction){const target=page+direction,count=Math.ceil(matching().length/perPage);if(busy||target<0||target>=count)return;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced){page=target;draw();return}busy=true;previous.disabled=true;next.disabled=true;sheet.classList.remove('turn-next','turn-prev');void sheet.offsetWidth;sheet.classList.add(direction>0?'turn-next':'turn-prev');setTimeout(()=>{page=target;draw()},270);setTimeout(()=>{sheet.classList.remove('turn-next','turn-prev');busy=false;draw()},570)}
async function load(){try{const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)throw Error('Gallery temporarily unavailable');const data=await r.json();all=Array.isArray(data.photos)?data.photos:[];const artists=[...new Set(all.map(p=>p.artist))].sort((a,b)=>a.localeCompare(b));for(const artist of artists){const opt=document.createElement('option');opt.value=artist;opt.textContent=artist;filter.append(opt)}draw()}catch(e){status.textContent='Could not load the gallery right now. Please refresh the page.'}}
filter.addEventListener('change',()=>{page=0;draw()});previous.addEventListener('click',()=>turn(-1));next.addEventListener('click',()=>turn(1));load();</script></body></html>
