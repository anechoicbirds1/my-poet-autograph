<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reward Ticket Desk | Anechoic Birds</title><style>body{background:#15101d;color:#f9f4fc;font:16px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:24px}h1{margin-bottom:8px}.sub{color:#cfc3d7}.group{border:1px solid #655173;background:#251b30;border-radius:12px;padding:18px;margin:18px 0}.ticket{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-top:1px solid #54445f;flex-wrap:wrap}button{background:#f4b965;color:#1d1425;border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}small{color:#d2c5d9}a{color:#f4b965}#notice{padding:12px;background:#30253d;border-radius:8px}input{padding:10px;border-radius:6px;border:1px solid #7e6a8a;background:#20192a;color:white}</style></head><body><main><h1>Anechoic Birds · Reward Ticket Desk</h1><p class="sub">Admin only. Issue and redeem earned admission and raffle tickets. Each ticket can be redeemed once.</p><p><a href="my-poet-autograph-admin-v2.html">← Admin dashboard</a></p><p id="notice" role="status">Checking administrator access…</p><button id="refresh" type="button">Refresh Ticket List</button><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const base='https://ncakmtncvsribnkslsok.supabase.co',pub='sb_publishable_mvOTUOQDUfWamS2CON_Hww_vWFTe2in',sb=supabase.createClient(base,pub),notice=document.getElementById('notice'),list=document.getElementById('list');async function request(method,body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sign in as an administrator first.');const r=await fetch(base+'/functions/v1/admin-reward-tickets',{method,headers:{Authorization:'Bearer '+session.access_token,apikey:pub,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}async function load(){list.replaceChildren();try{const data=await request('GET');notice.textContent='Ticket records loaded. Earned tickets must be issued before redemption.';if(!data.cycles.length){list.append(el('p','No qualifying reward tickets yet.'));return}for(const c of data.cycles){const section=el('section','');section.className='group';section.append(el('h2',c.fan_name+' · '+c.cycle_year+'–'+(c.cycle_year+1)),el('p',c.fan_email+' · '+c.credit_count+' qualifying artists'));for(const t of c.tickets){const row=el('div','');row.className='ticket';const info=el('div','');info.append(el('strong',(t.kind==='admission'?'Admission':'Raffle')+' · '+t.status.toUpperCase()),el('br',''),el('small','Ticket ID: '+t.id));row.append(info);if(t.status!=='redeemed'){const button=el('button',t.status==='earned'?'Issue Ticket':'Redeem Ticket');button.onclick=async()=>{const action=t.status==='earned'?'issue':'redeem';if(!confirm((action==='issue'?'Issue':'Permanently mark redeemed')+' this '+t.kind+' ticket?'))return;button.disabled=true;try{await request('POST',{ticket_id:t.id,action});await load()}catch(e){notice.textContent=e.message;button.disabled=false}};row.append(button)}section.append(row)}list.append(section)}}catch(e){notice.textContent=e.message}}document.getElementById('refresh').onclick=load;load();</script></body></html>
